services:
  - type: web
    name: moss-atelier
    env: node
    plan: free
    buildCommand: npm install && node scripts/build-config.mjs
    startCommand: node server/proxy.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      - key: SERPAPI_CACHE_HOURS
        value: 24
      - key: SENTRY_DSN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
