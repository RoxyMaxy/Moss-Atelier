name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run Secret Leakage Audit
        run: |
          ! git grep -nE "AQ\.|GEMINI_API_KEY=[A-Za-z0-9]|SERPAPI_KEY=[A-Za-z0-9]|SENTRY_DSN=https|postgres(ql)?://[^ ]*:[^ ]*@"
      - name: Run Test Suite
        run: node --test
